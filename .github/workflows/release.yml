name: 正式发布
on:
  push:
    tags: ["v*"]
permissions: { contents: write, packages: write }
env:
  RELEASE_TAG: ${{ github.ref_name }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: 校验版本
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: 构建前端
        working-directory: frontend
        run: npm ci && npm run build
      - name: 嵌入前端
        run: rm -rf backend/cmd/server/web/dist && mkdir -p backend/cmd/server/web/dist && cp -R frontend/dist/. backend/cmd/server/web/dist/
      - name: 测试
        working-directory: backend
        run: go test ./...
      - name: 构建发布包
        working-directory: backend
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p ../release
          for TARGET in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${TARGET%/*}"; GOARCH="${TARGET#*/}"; OUT="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildType=release -X main.GitHubRepo=${GITHUB_REPOSITORY}" -o "$OUT/channel-manage" ./cmd/server
            tar -C "$OUT" -czf "../release/channel-manage_${VERSION}_${GOOS}_${GOARCH}.tar.gz" channel-manage
          done
          cd ../release && sha256sum channel-manage_*.tar.gz > checksums.txt
      - name: 发布 Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v v="$VERSION" '$0=="## "v || index($0,"## "v" - ")==1 {p=1;next} p&&/^## /{exit} p{print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$RELEASE_TAG" release/* --title "渠道管家 ${RELEASE_TAG}" --notes-file release-notes.md
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            BUILD_TYPE=release
            GITHUB_REPO=${{ github.repository }}
