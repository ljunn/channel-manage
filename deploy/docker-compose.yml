services:
  postgres:
    image: postgres:16-alpine
    container_name: channel-manage-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    image: ${CHANNEL_MANAGE_IMAGE:-ghcr.io/ljunn/channel-manage:latest}
    container_name: channel-manage-app
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${POSTGRES_DB}
      DATABASE_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEPLOYMENT_MODE: docker
      UPDATE_GITHUB_REPO: ${UPDATE_GITHUB_REPO:-ljunn/channel-manage}
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports: ["${APP_PORT:-4473}:8080"]
    restart: unless-stopped
volumes: { postgres_data: {} }
