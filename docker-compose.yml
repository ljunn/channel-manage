services:
  postgres:
    image: postgres:16-alpine
    container_name: channel-manage-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-channel_manage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-channel_manage_password}
      POSTGRES_DB: ${POSTGRES_DB:-channel_manage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-channel_manage} -d ${POSTGRES_DB:-channel_manage}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: ${CHANNEL_MANAGE_IMAGE:-channel-manage-local:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: channel-manage-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-channel_manage}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-channel_manage_password}
      DATABASE_DBNAME: ${POSTGRES_DB:-channel_manage}
      DATABASE_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-channel-manage-local-secret-change-me-now}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@channel.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEPLOYMENT_MODE: docker
      UPDATE_GITHUB_REPO: ${UPDATE_GITHUB_REPO:-ljunn/channel-manage}
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
      ALLOW_INSECURE_UPSTREAMS: ${ALLOW_INSECURE_UPSTREAMS:-false}
      ALLOW_PRIVATE_UPSTREAMS: ${ALLOW_PRIVATE_UPSTREAMS:-false}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-4473}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
